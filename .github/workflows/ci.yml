name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Build production container
        run: docker build --tag gpt-game-arena:ci .

      - name: Smoke production container
        run: |
          docker run --detach --name gpt-game-arena-ci \
            --publish 18080:8000 \
            --tmpfs /data:rw,mode=0700,uid=1000,gid=1000 \
            --env PUBLIC_BASE_URL=https://games.example.com \
            --env GAME_STORE_PATH=/data/game-sessions.json \
            gpt-game-arena:ci
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18080/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs gpt-game-arena-ci
          exit 1

      - name: Stop production container
        if: always()
        run: docker rm --force gpt-game-arena-ci || true
